<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>参数化零食售货机 · 独立预览</title>
    <link rel="stylesheet" href="./preview.css" />
  </head>
  <body>
    <main id="preview-root">
      <canvas id="preview-canvas" aria-label="参数化零食售货机三维预览"></canvas>
      <section class="brand" aria-label="资产信息">
        <div class="eyebrow">赛博工厂 · 办公补给资产</div>
        <h1>参数化零食售货机</h1>
        <p class="subtitle">固定玻璃展示窗、内部货道、支付选择、前置取物和后侧补货语义一体化。</p>
        <div class="badges">
          <span class="badge" id="device-badge">桌面层级</span>
          <span class="badge" id="dimension-badge">920 × 1880 × 560 mm</span>
          <span class="badge">状态：规划中</span>
        </div>
      </section>

      <section class="controls" aria-label="预览参数">
        <header class="controls-header">
          <div>
            <h2>模型参数</h2>
            <p>拖动视口旋转，滚轮或双指缩放。</p>
          </div>
          <span class="live-status">实时重建</span>
        </header>
        <div class="control-grid">
          <div class="control-row">
            <label for="width">宽度</label>
            <input id="width" type="range" min="720" max="1200" step="20" value="920" />
            <output id="width-output">920 mm</output>
          </div>
          <div class="control-row">
            <label for="height">高度</label>
            <input id="height" type="range" min="1600" max="2300" step="20" value="1880" />
            <output id="height-output">1880 mm</output>
          </div>
          <div class="control-row">
            <label for="depth">深度</label>
            <input id="depth" type="range" min="440" max="720" step="20" value="560" />
            <output id="depth-output">560 mm</output>
          </div>
        </div>
        <div class="select-row">
          <label>柜体配色
            <select id="finish">
              <option value="graphite">石墨黑</option>
              <option value="porcelain">瓷白</option>
              <option value="sage">鼠尾草绿</option>
            </select>
          </label>
          <label>预览层级
            <select id="device">
              <option value="auto">跟随屏幕</option>
              <option value="desktop">桌面</option>
              <option value="mobile">手机</option>
            </select>
          </label>
        </div>
        <button id="pickup-toggle" type="button" aria-pressed="false">打开取物挡板</button>
      </section>

      <aside class="legend" aria-label="锚点图例">
        <span><i class="dot select"></i>选择</span>
        <span><i class="dot pickup"></i>取物</span>
        <span><i class="dot refill"></i>补货</span>
      </aside>
    </main>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
