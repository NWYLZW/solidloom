<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>现代休息区资产套件 · 独立预览</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
        --ink: #eef6f4;
        --muted: #93a7a4;
        --line: rgba(151, 190, 184, 0.22);
        --surface: rgba(12, 21, 24, 0.86);
        --accent: #65e0d0;
        --panel-edge-inset: 14px;
        --panel-padding: var(--panel-edge-inset);
        --control-padding-y: 8px;
        --control-padding-x: 10px;
      }

      * { box-sizing: border-box; }
      html, body, #preview-root { width: 100%; height: 100%; margin: 0; overflow: hidden; }
      body {
        background:
          radial-gradient(circle at 50% 30%, rgba(56, 112, 103, 0.24), transparent 42%),
          linear-gradient(145deg, #081013 0%, #111e21 52%, #080d0f 100%);
        color: var(--ink);
      }
      button, input, select { font: inherit; }
      #preview-root { position: relative; }
      #preview-canvas { display: block; width: 100%; height: 100%; touch-action: none; }

      .brand {
        position: absolute;
        top: 22px;
        left: 24px;
        max-width: min(470px, calc(100% - 48px));
        pointer-events: none;
      }
      .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: 0.15em; }
      h1 { margin: 8px 0 7px; font-size: clamp(25px, 3vw, 43px); line-height: 1.05; }
      .subtitle { color: var(--muted); font-size: 13px; line-height: 1.6; }
      .badges { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 13px; }
      .badge {
        border: 1px solid var(--line);
        border-radius: 999px;
        background: rgba(10, 18, 20, 0.7);
        color: #c6d8d5;
        padding: 6px 10px;
        font-size: 11px;
      }
      .badge[data-active="true"] { border-color: rgba(101, 224, 208, 0.72); color: var(--accent); }

      .controls {
        position: absolute;
        top: 22px;
        right: 24px;
        width: 350px;
        border: 1px solid var(--line);
        border-radius: 16px;
        background: var(--surface);
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.34);
        padding: var(--panel-padding);
        backdrop-filter: blur(18px);
      }
      .controls h2 { margin: 0 0 4px; font-size: 14px; }
      .control-note { margin: 0 0 14px; color: var(--muted); font-size: 11px; }
      .control-row {
        display: grid;
        grid-template-columns: 70px 1fr 58px;
        gap: 9px;
        align-items: center;
        margin-top: 10px;
      }
      .control-row label { color: #c6d6d3; font-size: 12px; }
      .control-row output { color: var(--accent); font-size: 10px; text-align: right; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .select-row { display: grid; grid-template-columns: 1fr 1fr; gap: 9px; margin-top: 12px; }
      .select-row label { display: grid; gap: 6px; color: var(--muted); font-size: 11px; }
      select,
      .action-button {
        width: 100%;
        min-height: 36px;
        border: 1px solid rgba(126, 170, 164, 0.3);
        border-radius: 9px;
        background: rgba(23, 36, 39, 0.94);
        color: var(--ink);
        padding: var(--control-padding-y) var(--control-padding-x);
      }
      .button-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 9px; margin-top: 10px; }
      .action-button { cursor: pointer; font-size: 12px; white-space: nowrap; }
      .action-button:hover,
      .action-button:focus-visible { border-color: rgba(101, 224, 208, 0.76); outline: none; }
      .action-button[aria-pressed="true"] {
        border-color: var(--accent);
        background: rgba(48, 119, 110, 0.32);
      }

      .legend {
        position: absolute;
        right: 24px;
        bottom: 22px;
        display: flex;
        gap: 14px;
        color: var(--muted);
        font-size: 10px;
        pointer-events: none;
      }
      .legend-item { display: flex; gap: 6px; align-items: center; }
      .legend-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
      .legend-dot[data-kind="light"] { background: #f4cf83; box-shadow: 0 0 10px #f4cf83; }

      @media (max-width: 780px) {
        .brand { top: 12px; left: 12px; max-width: calc(100% - 24px); }
        .eyebrow { font-size: 9px; }
        h1 { margin: 4px 0; font-size: 23px; }
        .subtitle { display: none; }
        .badges { margin-top: 7px; gap: 5px; }
        .badge { padding: 4px 7px; font-size: 9px; }

        .controls {
          top: auto;
          right: 12px;
          bottom: 12px;
          left: 12px;
          width: auto;
          border-radius: 14px;
          padding: 10px;
        }
        .controls h2 { font-size: 12px; }
        .control-note,
        .control-grid { display: none; }
        .select-row { margin-top: 8px; }
        .select-row label:nth-child(n + 3) { display: none; }
        select { min-height: 32px; padding: 5px 7px; font-size: 10px; }
        .button-row { gap: 7px; margin-top: 8px; }
        .action-button { min-height: 32px; padding: 5px 7px; font-size: 10px; }
        .legend { display: none; }
      }
    </style>
  </head>
  <body>
    <main id="preview-root">
      <canvas id="preview-canvas" aria-label="现代休息区资产套件三维预览"></canvas>

      <section class="brand" aria-label="资产信息">
        <div class="eyebrow">赛博工厂 · 休息区资产</div>
        <h1>现代休息区套件</h1>
        <div class="subtitle">按 1720 mm 漫游角色包络重做家具宽度、座深、净距与碰撞体，五个座位分别校准。</div>
        <div class="badges">
          <span class="badge" id="device-badge">桌面完整层级</span>
          <span class="badge">7 组独立组件</span>
          <span class="badge">5 个坐下锚点</span>
          <span class="badge" data-active="true">1720 mm 角色比例尺</span>
          <span class="badge" id="layout-badge">围合布局</span>
          <span class="badge" id="lamp-badge" data-active="true">落地灯：开启</span>
          <span class="badge">状态：规划中</span>
        </div>
      </section>

      <section class="controls" aria-label="预览参数与交互">
        <h2>组合与尺寸</h2>
        <p class="control-note">拖动视口旋转；用运行时角色比例尺检查座位宽度、座深、动线和移动端层级。</p>
        <div class="control-grid">
          <div class="control-row">
            <label for="sofa-width">沙发宽度</label>
            <input id="sofa-width" type="range" min="2400" max="3400" step="20" value="2800" />
            <output id="sofa-width-output">2800 mm</output>
          </div>
          <div class="control-row">
            <label for="seat-height">座面高度</label>
            <input id="seat-height" type="range" min="380" max="470" step="10" value="420" />
            <output id="seat-height-output">420 mm</output>
          </div>
          <div class="control-row">
            <label for="table-width">茶几宽度</label>
            <input id="table-width" type="range" min="900" max="1600" step="20" value="1200" />
            <output id="table-width-output">1200 mm</output>
          </div>
          <div class="control-row">
            <label for="rug-width">地毯宽度</label>
            <input id="rug-width" type="range" min="4600" max="6200" step="40" value="5200" />
            <output id="rug-width-output">5200 mm</output>
          </div>
        </div>
        <div class="select-row">
          <label>组合布局
            <select id="layout">
              <option value="conversation">围合布局</option>
              <option value="linear">并列布局</option>
              <option value="compact">紧凑布局</option>
            </select>
          </label>
          <label>织物配色
            <select id="palette">
              <option value="teal">深青</option>
              <option value="clay">陶土</option>
              <option value="sand">暖沙</option>
            </select>
          </label>
          <label>预览层级
            <select id="device">
              <option value="auto">跟随屏幕</option>
              <option value="desktop">桌面</option>
              <option value="mobile">手机</option>
            </select>
          </label>
        </div>
        <div class="button-row">
          <button class="action-button" id="lamp-toggle" type="button" aria-pressed="true">关闭落地灯</button>
          <button class="action-button" id="anchor-toggle" type="button" aria-pressed="true">隐藏座位锚点</button>
          <button class="action-button" id="scale-toggle" type="button" aria-pressed="true">隐藏角色比例</button>
        </div>
      </section>

      <div class="legend" aria-hidden="true">
        <span class="legend-item"><span class="legend-dot"></span>坐下锚点与朝向</span>
        <span class="legend-item"><span class="legend-dot" data-kind="light"></span>可切换灯光</span>
      </div>
    </main>
    <script type="module" src="./preview.ts"></script>
  </body>
</html>
